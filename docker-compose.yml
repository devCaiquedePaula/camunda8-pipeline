# Local development stack: Camunda 8.10 orchestration cluster (Zeebe + Operate + Tasklist, H2 storage) and Redis.
# Based on the official camunda-distributions docker-compose 8.10 (lightweight, no Elasticsearch, no Connectors).
services:
  camunda-data-init:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.10.9}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  orchestration:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.10.9}
    container_name: orchestration
    ports:
      - "26500:26500" # Zeebe gRPC
      - "9600:9600"   # management / health
      - "8080:8080"   # REST API, Operate, Tasklist (login demo / demo)
    mem_limit: 1g
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 5s
      retries: 30
      start_period: 30s
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
      - ./docker/camunda/application-h2.yaml:/usr/local/camunda/config/application.yaml:ro
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  camunda:
  camunda-data:
